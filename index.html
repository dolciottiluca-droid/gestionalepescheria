<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pescheria Smart</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background: #f0f7ff; padding-bottom: 80px; font-family: sans-serif; }
        .ocean { background: linear-gradient(135deg, #0284c7, #0369a1); border-radius: 0 0 24px 24px; }
        .fish-btn { background: #ea580c; color: white; border-radius: 50px; }
        .page { display: none; }
        .page.active { display: block; }
    </style>
</head>
<body class="max-w-md mx-auto bg-slate-50 min-h-screen shadow-xl">

    <header class="ocean text-white p-5 flex justify-between items-center">
        <div>
            <p class="text-xs text-sky-200 uppercase font-bold">Reparto 16 • Ancona</p>
            <h1 class="text-xl font-bold">Banco Pescheria 🐟</h1>
        </div>
        <button onclick="apriKey()" class="bg-white/20 p-2 rounded-full"><i class="fa-solid fa-gear"></i></button>
    </header>

    <div id="p-home" class="page active p-4 space-y-3">
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
            <p class="text-xs text-slate-400 font-bold uppercase">Ultimo Incasso (11/11/2026)</p>
            <p class="text-2xl font-extrabold text-sky-900" id="tot-home">2.572,50 €</p>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm border">
            <p class="text-xs font-bold text-slate-500 mb-2">Storico Incassi Reparto 16</p>
            <div id="lista-home" class="space-y-2 text-sm"></div>
        </div>
    </div>

    <div id="p-incassi" class="page p-4 space-y-3">
        <div class="bg-sky-600 text-white p-4 rounded-2xl flex justify-between items-center">
            <div><p class="font-bold text-sm">Foto Tabulato</p><p class="text-xs text-sky-100">Legge riga 16 PESCE</p></div>
            <label class="bg-white text-sky-700 px-3 py-2 rounded-xl text-xs font-bold cursor-pointer">📷 Scatta<input type="file" accept="image/*" capture="environment" onchange="fotoIncasso(event)" class="hidden"></label>
        </div>
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
            <input type="text" id="i-data" placeholder="Data (es. 12/11/2026)" class="w-full p-2 border rounded-xl text-sm">
            <input type="number" step="0.01" id="i-euro" placeholder="Incasso €" class="w-full p-2 border rounded-xl text-sm">
            <textarea id="i-note" placeholder="Note giornata..." class="w-full p-2 bg-amber-50 border rounded-xl text-sm"></textarea>
            <button onclick="salvaIncasso()" class="fish-btn w-full py-2.5 font-bold text-sm">🐟 SALVA INCASSO</button>
        </div>
    </div>

    <div id="p-ordini" class="page p-4 space-y-3">
        <div class="grid grid-cols-2 gap-2">
            <button onclick="mostraSub('forn')" class="bg-sky-600 text-white py-2 rounded-xl text-xs font-bold">Ordini Ufficio</button>
            <button onclick="mostraSub('cli')" class="bg-orange-500 text-white py-2 rounded-xl text-xs font-bold">Post-it Clienti</button>
        </div>
        <div id="sub-forn" class="space-y-3">
            <div class="bg-sky-600 text-white p-3 rounded-2xl flex justify-between items-center">
                <span class="text-xs font-bold">Foto Ordine Ufficio</span>
                <label class="bg-white text-sky-700 px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">📷 Scatta<input type="file" accept="image/*" capture="environment" onchange="fotoOrdine(event)" class="hidden"></label>
            </div>
            <div class="bg-white p-3 rounded-2xl space-y-2">
                <input type="text" id="o-prod" placeholder="Prodotto e Quantità" class="w-full p-2 border rounded-xl text-sm">
                <textarea id="o-note" placeholder="Note ordine..." class="w-full p-2 bg-amber-50 border rounded-xl text-sm"></textarea>
                <button onclick="salvaOrdine()" class="fish-btn w-full py-2 font-bold text-xs">🐟 AGGIUNGI ORDINE</button>
            </div>
            <div id="lista-ordini" class="space-y-2"></div>
        </div>
        <div id="sub-cli" class="hidden space-y-3">
            <div class="bg-orange-500 text-white p-3 rounded-2xl flex justify-between items-center">
                <span class="text-xs font-bold">Foto Post-it Cliente</span>
                <label class="bg-white text-orange-600 px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">📷 Post-it<input type="file" accept="image/*" capture="environment" onchange="fotoPostit(event)" class="hidden"></label>
            </div>
            <div class="bg-white p-3 rounded-2xl space-y-2">
                <input type="text" id="c-nome" placeholder="Cliente e Ritiro" class="w-full p-2 border rounded-xl text-sm">
                <input type="text" id="c-cosa" placeholder="Cosa ha ordinato" class="w-full p-2 border rounded-xl text-sm">
                <textarea id="c-note" placeholder="Note lavorazione..." class="w-full p-2 bg-amber-50 border rounded-xl text-sm"></textarea>
                <button onclick="salvaCliente()" class="fish-btn w-full py-2 font-bold text-xs">🐟 SALVA CLIENTE</button>
            </div>
            <div id="lista-clienti" class="space-y-2"></div>
        </div>
    </div>

    <div id="p-inv" class="page p-4 space-y-3">
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
            <h2 class="font-bold text-sm">Inventario, Scarti e Furti</h2>
            <select id="v-tipo" class="w-full p-2 border rounded-xl text-sm"><option>Scarto / Calo</option><option>Furto / Ammanco</option><option>Differenza Inventariale</option></select>
            <input type="text" id="v-prod" placeholder="Prodotto e Kg/€" class="w-full p-2 border rounded-xl text-sm">
            <textarea id="v-note" placeholder="Note dettagliate..." class="w-full p-2 bg-amber-50 border rounded-xl text-sm"></textarea>
            <button onclick="salvaInv()" class="fish-btn w-full py-2.5 font-bold text-sm">🐟 SALVA MOVIMENTO</button>
        </div>
        <div id="lista-inv" class="space-y-2"></div>
    </div>

    <div id="p-org" class="page p-4 space-y-3">
        <div class="bg-sky-600 text-white p-3 rounded-2xl flex justify-between items-center">
            <span class="text-xs font-bold">Foto Tabella Turni B/N</span>
            <label class="bg-white text-sky-700 px-3 py-1.5 rounded-xl text-xs font-bold cursor-pointer">📷 Scatta<input type="file" accept="image/*" capture="environment" onchange="fotoTurni(event)" class="hidden"></label>
        </div>
        <div class="grid grid-cols-7 gap-1" id="giorni-bar"></div>
        <div class="bg-white p-4 rounded-2xl shadow-sm space-y-2">
            <h2 class="font-bold text-sm" id="titolo-giorno">Turni Mercoledì</h2>
            <div id="lista-turni" class="space-y-2"></div>
        </div>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t py-2 flex justify-around text-xs font-bold text-slate-500">
        <button onclick="vai('p-home')">🏠 Home</button>
        <button onclick="vai('p-incassi')">💶 Incassi</button>
        <button onclick="vai('p-ordini')">🐟 Ordini</button>
        <button onclick="vai('p-inv')">📦 Inv.</button>
        <button onclick="vai('p-org')">👥 Turni</button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
